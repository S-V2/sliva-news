# Build the production image and push it to GHCR.
#
# Images are built HERE, in CI, for linux/amd64 only — the deployment VM is
# x86_64. Nothing is built on the VM itself; it only pulls.
#
# The GHCR namespace is lowercased from the org name: S-V2 -> s-v2.
# Packages default to PRIVATE, so the VM needs `docker login ghcr.io` with a
# PAT carrying read:packages before `docker compose pull` will work.
#
# This workflow is additive: it does not replace or modify ci.yml (lint/test).
#
# PR BUILDS: this workflow also runs on pull_request with `push: false`, so every PR
# exercises the real image build. That matters because the repo has TWO build paths —
# ci.yml goes through scripts/build-verified.sh (3-minute timeout, .sites-runtime
# sandbox), while the Dockerfile calls `npx vinext build` directly. Without a PR image
# build, a green ci.yml would not prove the image builds and the two paths could drift
# silently until a deploy failed.
#
# On pull_request the GHCR login is skipped entirely: GITHUB_TOKEN on a fork PR has no
# packages: write, and a build that does not push needs no registry credentials. The GHA
# cache is also read-only on PRs (cache-from only, no cache-to), because fork PRs cannot
# write the base repo's cache and a failed export would fail the build.
#
# This repo needs no build arguments.

name: Publish Sliva News image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-sliva-news-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push sliva-news
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/s-v2/sliva-news:latest
            ghcr.io/s-v2/sliva-news:${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
          # Single-platform image: skip provenance/SBOM attestations so the pushed
          # tag is a plain image manifest rather than an index with an
          # unknown/unknown entry, which keeps `docker pull` on the VM simple.
          provenance: false
